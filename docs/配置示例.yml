# 变化额度只在首次初始化／迁移时导入；后续以页面保存的变化规则为准。
# 合并到目标 profile 的 cordis.patch.yml；不要覆盖已有 patch。
- id: dsh-mood
  config:
    dynamics:
      reactionVersion: 2 # 中性性格保留基础事件响应；旧记录仍使用旧规则。
      initialTraits:
        social_pref: 0
        explore_pref: 0
        stance_firm: 0
        intimacy_pref: 0
        outcome_expect: 0
        reactivity: 0
        recovery: 0
      emotionLevels:
        none: 0
        slight: 0.2
        moderate: 0.5
        intense: 1
      traitLevels:
        none: 0
        slight: 0.01
        moderate: 0.025
        intense: 0.05
      halfLivesMs:
        valence: 14400000
        affinity: 21600000
        anger: 7200000
        fear: 7200000
        surprise: 300000
      emotionPerEvent: 15
      emotionPerHour: 40 # 首次初始化／迁移后，在页面“变化规则”配置。
      emotionWindowMs: 3600000
      traitPerEvent: 0.05
      traitPerDay: 3
      traitWindowMs: 86400000
      minTraitEvidence: 1
